<svg width="274" height="71" viewBox="0 0 274 71" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep rich premium dark blue-indigo card gradient -->
    <linearGradient id="cardBg" x1="0" y1="0" x2="274" y2="71" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="45%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#3A506B"/>
    </linearGradient>

    <!-- Radial light highlight for premium glossmorphism -->
    <radialGradient id="light" cx="30%" cy="30%" r="70%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64DFDF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#48CAE4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Decorative chromatic glows -->
    <radialGradient id="decoPink" cx="240" cy="15" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="decoCyan" cx="260" cy="65" r="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Cash bills gradient -->
    <linearGradient id="cashGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cashGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Hand skin/glove metallic gradient -->
    <linearGradient id="handGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Gold coin gradients -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Shadow effects -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded Base Card -->
  <rect width="274" height="71" rx="16" fill="url(#cardBg)"/>
  <rect width="274" height="71" rx="16" fill="url(#light)"/>

  <!-- Decorative chromatic glows -->
  <circle cx="240" cy="15" r="90" fill="url(#decoPink)"/>
  <circle cx="260" cy="65" r="80" fill="url(#decoCyan)"/>

  <!-- Abstract wave overlay for premium finance look -->
  <path d="M160 -10 C200 20, 210 50, 274 40 L274 -10 Z" fill="#FFFFFF" opacity="0.03" />
  <path d="M140 80 C190 60, 220 70, 274 55 L274 80 Z" fill="#FFFFFF" opacity="0.02" />

  <!-- ================== LOGO GRAPHICS GROUP ================== -->
  <!-- Positioned on the left (x center around 48, y center around 35.5) -->
  <g filter="url(#shadow)">
    <!-- Floating Gold Coin 1 (behind cash) -->
    <circle cx="34" cy="22" r="5" fill="url(#goldGrad)"/>
    <circle cx="34" cy="22" r="3.5" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.5"/>

    <!-- Cash Bill 2 (underneath) -->
    <g transform="translate(56, 32) rotate(12)">
      <rect x="-21" y="-12" width="42" height="24" rx="3" fill="url(#cashGrad2)" stroke="#059669" stroke-width="1"/>
      <rect x="-17" y="-9" width="34" height="18" rx="1.5" fill="none" stroke="#A7F3D0" stroke-width="0.7" opacity="0.4"/>
      <circle cx="0" cy="0" r="4.5" fill="#A7F3D0" opacity="0.5"/>
    </g>

    <!-- Cash Bill 1 (top) -->
    <g transform="translate(50, 29) rotate(-12)">
      <rect x="-21" y="-12" width="42" height="24" rx="3" fill="url(#cashGrad1)" stroke="#34D399" stroke-width="1"/>
      <rect x="-17" y="-9" width="34" height="18" rx="1.5" fill="none" stroke="#F0FDF4" stroke-width="0.8" opacity="0.6"/>
      <!-- Cash center emblem -->
      <circle cx="0" cy="0" r="4.5" fill="#F0FDF4" opacity="0.8"/>
      <!-- Subtly styled dollar/currency symbol outline inside emblem -->
      <path d="M-1.5 -2.5 C-1.5 -2.5, -0.5 -3, 0 -3 C1 -3, 1.5 -2, 1 -1 C0.5 0, -1.5 0.5, -1.5 1.5 C-1.5 2.5, -0.5 3, 0.5 3 C1.5 3, 2.2 2.5, 2.2 2.5 M0.5 -4.5 L0.5 4.5" fill="none" stroke="#10B981" stroke-width="0.8"/>
    </g>

    <!-- Floating Gold Coin 2 (foreground left) -->
    <circle cx="28" cy="46" r="6" fill="url(#goldGrad)"/>
    <circle cx="28" cy="46" r="4.2" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.6"/>
    <path d="M28 43.5 L28 48.5 M25.5 46 L30.5 46" stroke="#CA8A04" stroke-width="0.8" opacity="0.5"/>

    <!-- Stylized Premium Hand wrapping bills from bottom-left -->
    <path d="M12 71 
             C 18 58, 22 52, 27 48 
             C 29 46, 32 46, 35 48 
             C 37 49, 39 52, 38 55 
             C 37 57, 34 60, 32 64 
             C 30 67, 30 69, 30 71 Z" 
          fill="url(#handGrad)"/>

    <!-- Wrist cuff / sleeve line for details -->
    <path d="M12 71 C18 69, 24 69, 30 71" stroke="#CBD5E1" stroke-width="1.2"/>

    <!-- Index Finger wrapping cash bill -->
    <path d="M35 48 C 39 43, 44 45, 45 49 C 46 52, 43 54, 39 53" fill="url(#handGrad)"/>
    <!-- Middle Finger -->
    <path d="M37 52 C 41 48, 45 50, 46 53 C 47 56, 43 57, 40 56" fill="url(#handGrad)"/>
    
    <!-- Floating Gold Coin 3 (foreground right) -->
    <circle cx="76" cy="44" r="7.5" fill="url(#goldGrad)"/>
    <circle cx="76" cy="44" r="5.2" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6"/>
    <path d="M76 41 L76 47 M73 44 L79 44" stroke="#CA8A04" stroke-width="0.8" opacity="0.5"/>

    <!-- Small sparkles/stars for magic gold premium look -->
    <path d="M72 16 L73 19 L76 20 L73 21 L72 24 L71 21 L68 20 L71 19 Z" fill="#FDE047" opacity="0.8"/>
    <path d="M22 28 L22.5 30 L24 30.5 L22.5 31 L22 33 L21.5 31 L20 30.5 L21.5 30 Z" fill="#FDE047" opacity="0.8"/>
  </g>
</svg>
